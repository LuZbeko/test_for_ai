version: '3.8'

services:
  todo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: todo-api-container
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db
    volumes:
      # Mount volume for persistent database
      - todo-db-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - todo-network

  todo-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: todo-api-dev-container
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tests:/app/tests
      - ./.env:/app/.env
      # Prevent overwriting node_modules
      - /app/node_modules
    command: npm run dev
    networks:
      - todo-network
    profiles:
      - dev

volumes:
  todo-db-data:
    driver: local

networks:
  todo-network:
    driver: bridge